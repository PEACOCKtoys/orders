<DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0c3b47"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Peacock Order — Toy Shop</title>
<style>
:root{--ink:#10252e;--nav:#0c3b47;--nav2:#13596a;--teal:#0f8b8d;--gold:#ffd23f;--gold2:#f4b400;--bg:#e8f4f2;--card:#fff;--mut:#5b7078;--red:#c0392b}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 "Trebuchet MS",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--nav);color:#fff;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px}
.logo{font-size:21px;font-weight:700;letter-spacing:.3px}.logo i{font-style:normal;color:var(--gold)}
#q{flex:1;min-width:150px;padding:10px 12px;border:0;border-radius:8px;font:inherit}
nav{background:var(--nav2);display:flex;gap:4px;overflow-x:auto;padding:0 8px}
nav a{color:#fff;text-decoration:none;padding:10px 12px;white-space:nowrap;border-bottom:3px solid transparent}
nav a.on{border-color:var(--gold)}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--gold);color:var(--ink);font-weight:700}
button:hover{background:var(--gold2)}button.g{background:#fff;border:1px solid #b9cfcb}button.r{background:var(--red);color:#fff}
header button{padding:7px 12px}main{max-width:1100px;margin:auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border-radius:12px;padding:12px;box-shadow:0 1px 4px #0001}
.card img.p{width:100%;aspect-ratio:1;object-fit:contain;background:#f3f8f7;border-radius:8px}
.price{font-size:20px;font-weight:700}.mut{color:var(--mut);font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gal{display:flex;gap:6px;overflow-x:auto}.gal img{width:100%;flex:0 0 100%;aspect-ratio:1;object-fit:contain;background:#f3f8f7;border-radius:8px;scroll-snap-align:start}.gal{scroll-snap-type:x mandatory}
details{border-top:1px solid #e1ecea;padding:6px 0}summary{cursor:pointer}details img{width:90px;height:90px;object-fit:contain;display:block;margin-top:6px;border-radius:6px}
.line{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid #e1ecea}.line img{width:56px;height:56px;object-fit:contain;border-radius:6px;background:#f3f8f7}
.pill{background:#e0f2ef;border-radius:99px;padding:2px 10px;font-size:12px}
dialog{max-height:90vh;overflow:auto;border:0;border-radius:14px;padding:18px;width:min(440px,94vw)}dialog::backdrop{background:#0008}
input,select,textarea{font:inherit;width:100%;padding:9px;margin:4px 0 10px;border:1px solid #b9cfcb;border-radius:8px;font:inherit}
.hero{background:linear-gradient(120deg,var(--nav),var(--teal));color:#fff;border-radius:14px;padding:22px;margin-bottom:14px}.hero h1{margin:0 0 4px;font-size:26px}

.card{position:relative}.tag{position:absolute;top:8px;left:8px;z-index:1;background:var(--teal);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}.tag.Sale{background:var(--red)}
.off{color:var(--red);font-size:13px;font-weight:700}.wa{display:inline-block;background:#25d366;color:#fff;text-decoration:none;font-weight:700;padding:8px 14px;border-radius:8px}
.steps{display:flex;gap:3px;margin:8px 0}.steps span{flex:1;text-align:center;padding:5px 2px;background:#dfe9e7;font-size:12px;color:var(--mut)}.steps span:first-child{border-radius:8px 0 0 8px}.steps span:last-child{border-radius:0 8px 8px 0}.steps span.on{background:var(--teal);color:#fff;font-weight:700}
/* ---- animations ---- */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes drift{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.enter .card,.enter .hero{animation:rise .45s ease both}
.enter .grid .card:nth-child(2){animation-delay:.05s}.enter .grid .card:nth-child(3){animation-delay:.1s}.enter .grid .card:nth-child(4){animation-delay:.15s}.enter .grid .card:nth-child(n+5){animation-delay:.2s}
.card{transition:transform .2s,box-shadow .2s}.grid .card:hover{transform:translateY(-4px);box-shadow:0 8px 18px #0f8b8d33}
.card img.p,.gal img{transition:transform .3s}.card:hover .gal img{transform:scale(1.04)}
button{transition:transform .12s,background .2s,box-shadow .2s}button:hover{transform:translateY(-1px);box-shadow:0 3px 8px #0003}button:active{transform:scale(.95)}
nav a{transition:background .2s,border-color .25s}nav a:hover{background:#ffffff1f}
.logo span{display:inline-block;animation:sway 3s ease-in-out infinite;transform-origin:70% 90%}
.hero{background-size:200% 200%;animation:drift 10s ease-in-out infinite}
dialog[open]{animation:pop .22s ease}.line,details{transition:background .2s}.line:hover{background:#f3f8f7}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><div class="logo"><span>🦚</span> Peacock <i>Order</i></div><input id="q" placeholder="Search toys…" aria-label="Search toys"><div class="row" id="acct"></div></header>
<nav id="nav"></nav><main id="main"></main><dialog id="dlg"></dialog>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithPopup,GoogleAuthProvider,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot,query,where,Timestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== EDIT THESE TWO THINGS ====== */
const OWNER = "singhkrishna7416@gmail.com";            // the owner's Google email (lowercase)
const firebaseConfig = {
  apiKey: "AIzaSyD7NOd765z9Tbx4v6ycI-fYNZiGWUNejnc",
  authDomain: "peacock-b8c4e.firebaseapp.com",
  projectId: "peacock-b8c4e",
  storageBucket: "peacock-b8c4e.firebasestorage.app",
  messagingSenderId: "860663177984",
  appId: "1:860663177984:web:6224b27123f514ad5749e5",
  measurementId: "G-2R5GQXZ2L7"
};
/* =================================== */

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app); // sign-in is remembered on the device by default
const $=s=>document.querySelector(s),DAY=864e5;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"₹"+Number(n).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2}),when=t=>new Date(t).toLocaleString();
let user=null,role=null,profile=null,items=[],orders=[],team=[],customers=[],myPricing=null,pricings={},unsubs=[],search="",cart={};
try{cart=JSON.parse(localStorage.getItem("po_cart")||"{}")}catch{}
const saveCart=()=>{try{localStorage.setItem("po_cart",JSON.stringify(cart))}catch{}};
const staff=()=>["owner","coOwner","admin"].includes(role),boss=()=>role==="owner"||role==="coOwner";
const nick=()=>profile?.nickname||(user?"Set nickname":"");

onAuthStateChanged(auth,async u=>{
  unsubs.forEach(f=>f());unsubs=[];user=u;role=null;profile=null;orders=[];team=[];customers=[];myPricing=null;pricings={};
  if(u){
    const e=u.email.toLowerCase();
    role=e===OWNER.toLowerCase()?"owner":"customer";draw(); // show signed-in state straight away
    if(role!=="owner")role=(await getDoc(doc(db,"roles",e)).catch(()=>null))?.data()?.role||"customer";
    profile=(await getDoc(doc(db,"users",u.uid)).catch(err=>{alert("Database not ready: "+err.message+"\nCreate Firestore and publish the rules (setup step 3).");return null}))?.data()||null;
    const oq=staff()?collection(db,"orders"):query(collection(db,"orders"),where("uid","==",u.uid));
    unsubs.push(onSnapshot(oq,s=>{orders=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.createdAt-a.createdAt);if(staff())sweep();draw()}));
    if(staff())unsubs.push(onSnapshot(collection(db,"pricing"),s=>{pricings={};s.docs.forEach(d=>pricings[d.id]=d.data());draw()},()=>{}));
    else unsubs.push(onSnapshot(doc(db,"pricing",u.uid),s=>{myPricing=s.data()||null;draw()},()=>{}));
    if(staff())unsubs.push(onSnapshot(collection(db,"users"),s=>{customers=s.docs.map(d=>({uid:d.id,...d.data()})).sort((a,b)=>(b.joinedAt||0)-(a.joinedAt||0));draw()},()=>{}));
    if(boss())unsubs.push(onSnapshot(collection(db,"roles"),s=>{team=s.docs.map(d=>({email:d.id,...d.data()}));draw()}));
    if(!profile)profileDlg();
  }
  draw();
});
onSnapshot(collection(db,"items"),s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));draw()});
addEventListener("hashchange",()=>{const m=$("#main");m.classList.add("enter");setTimeout(()=>m.classList.remove("enter"),900)});
$("#main").classList.add("enter");setTimeout(()=>$("#main").classList.remove("enter"),1200);
addEventListener("hashchange",draw);
$("#q").addEventListener("input",e=>{search=e.target.value.toLowerCase();if(view()==="shop")$("#grid").innerHTML=gridHtml()});

const view=()=>(location.hash||"#shop").slice(1);
const STEPS=["Received","Packed","Delivered"],stIdx=x=>x==="done"?2:x==="packed"?1:0;
const progress=x=>`<div class="steps">${STEPS.map((t,i)=>`<span class="${i<=stIdx(x)?"on":""}">${t}</span>`).join("")}</div>`;
const wa=(ph,t)=>{let p=String(ph).replace(/\D/g,"");if(p.length===10)p="91"+p;return "https://wa.me/"+p+"?text="+encodeURIComponent(t)};
const waOrder=o=>wa(o.phone,`Hello ${o.nickname}, this is Peacock Order about your order:\n`+o.items.map(x=>`• ${x.name} × ${x.qty}`).join("\n")+`\nTotal: ${money(o.total)}`);
let installEv=null;const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEv=e;draw()});
const installBtn=()=>installEv||(isIOS&&!standalone)?'<button class="g" data-a="install">📲 Install app</button>':"";
const open_=()=>orders.filter(o=>o.status!=="done"),done_=()=>orders.filter(o=>o.status==="done");
const cartN=()=>Object.values(cart).reduce((a,b)=>a+b,0);

// Orders marked complete are removed 15 days later (also handled server-side by the TTL policy on expireAt).
function sweep(){done_().filter(o=>Date.now()-o.doneAt>=15*DAY).forEach(o=>deleteDoc(doc(db,"orders",o.id)).catch(()=>{}))}

function draw(){
  $("#acct").innerHTML=installBtn()+(user?`<button class="g" data-a="profile" title="Edit nickname and phone">👤 ${esc(nick())}</button><button class="g" data-a="out">Sign out</button>`:`<button data-a="in">Sign in with Google</button>`);
  const tabs=[["shop","Shop"]];
  if(user)tabs.push(["cart",`Cart (${cartN()})`],["mine","My orders"]);
  if(staff())tabs.push(["orders",`Orders (${open_().length})`],["bin","Order done bin"],["customers",`Customers (${customers.length})`]);
  if(boss())tabs.push(["team","Team"]);
  let v=view();if(!tabs.some(t=>t[0]===v))v="shop";
  $("#nav").innerHTML=tabs.map(t=>`<a href="#${t[0]}" class="${t[0]===v?"on":""}">${t[1]}</a>`).join("");
  $("#q").style.display=v==="shop"?"":"none";
  $("#main").innerHTML=({shop:shopV,cart:cartV,mine:mineV,orders:ordersV,bin:binV,team:teamV,customers:custV}[v])();
}

/* ---------- Shop ---------- */
const priceFor=(it,p=myPricing)=>{const v=p?.prices?.[it.id];if(v!==undefined&&v!==""&&v!==null)return Number(v);return p?.discount>0?Math.round(it.price*(100-p.discount))/100:it.price};
const priceHtml=i=>{const m=user?priceFor(i):i.price;if(m!==i.price)return `${money(m)}${m<i.price?` <s class="mut">${money(i.price)}</s>`:""} <span class="off">Your price</span>`;
  return money(i.price)+(i.oldPrice>i.price?` <s class="mut">${money(i.oldPrice)}</s> <span class="off">${Math.round((1-i.price/i.oldPrice)*100)}% off</span>`:"")};
function gridHtml(){
  const l=items.filter(i=>i.name.toLowerCase().includes(search));
  if(!l.length)return `<p class="mut">${items.length?"No toys match your search.":"No toys listed yet."}</p>`;
  return l.map(i=>`<div class="card">${i.tag?`<span class="tag ${esc(i.tag)}">${esc(i.tag)}</span>`:""}<div class="gal">${(i.imgs||[]).map(s=>`<img src="${esc(s)}" alt="${esc(i.name)}">`).join("")||'<img alt="">'}</div>
   <h3 style="margin:8px 0 2px">${esc(i.name)}</h3><div class="price">${priceHtml(i)}</div>
   <div class="row" style="margin-top:8px">${user?`<button data-a="add" data-id="${i.id}">Add to cart</button>`:`<button data-a="in">Sign in to order</button>`}
   ${staff()?`<button class="g" data-a="edit" data-id="${i.id}">Edit</button><button class="r" data-a="del" data-id="${i.id}">Remove</button>`:""}</div></div>`).join("");
}
const shopV=()=>`<div class="hero"><h1>Toys that make playtime pop</h1><div>${user?"Add toys to your cart and place your order.":"Browse freely — sign in to place an order."}</div></div>
 ${staff()?`<p><button data-a="new">+ List a new toy</button></p>`:""}<div class="grid" id="grid">${gridHtml()}</div>`;

/* ---------- Cart & customer orders ---------- */
function cartV(){
  const l=Object.entries(cart).map(([id,q])=>({it:items.find(x=>x.id===id),q})).filter(x=>x.it);
  if(!l.length)return `<p>Your cart is empty. <a href="#shop">Browse toys</a></p>`;
  const t=l.reduce((a,x)=>a+priceFor(x.it)*x.q,0);
  return `<div class="card">${l.map(({it,q})=>`<div class="line"><img src="${esc(it.thumb||"")}" alt=""><div style="flex:1"><b>${esc(it.name)}</b><div class="mut">${money(priceFor(it))} each</div></div>
   <button class="g" data-a="dec" data-id="${it.id}">−</button><b>${q}</b><button class="g" data-a="add" data-id="${it.id}">+</button></div>`).join("")}
   <p class="price">Total ${money(t)}</p><p class="mut">No online payment — the shop will contact you to arrange it.</p><button data-a="place">Place order</button></div>`;
}
const mineV=()=>!orders.length?`<p>You haven't placed any orders yet.</p>`:orders.map(o=>`<div class="card" style="margin-bottom:12px">
  <div class="row"><b>${when(o.createdAt)}</b></div>${progress(o.status)}
  ${o.items.map(x=>`<div class="line"><img src="${esc(x.img)}" alt=""><div>${esc(x.name)} × <b>${x.qty}</b></div></div>`).join("")}</div>`).join("");

/* ---------- Staff pages ---------- */
const orderCard=(o,btn)=>`<div class="card" style="margin-bottom:12px">
  ${progress(o.status)}<div class="row"><b>${esc(o.nickname)}</b><span>📞 ${esc(o.phone)}</span><span class="mut">${when(o.createdAt)}</span><b style="margin-left:auto">${money(o.total)}</b></div>${o.shopName?`<div>🏪 <b>${esc(o.shopName)}</b>${o.address?" — "+esc(o.address):""}</div>`:""}
  ${o.items.map(x=>`<details><summary>${esc(x.name)} — ${money(x.price)} × <b>${x.qty}</b></summary><img src="${esc(x.img)}" alt=""></details>`).join("")}<div class="row"><a class="wa" href="${waOrder(o)}" target="_blank" rel="noopener">💬 Message on WhatsApp</a>${btn}</div></div>`;
const ordersV=()=>open_().length?open_().map(o=>orderCard(o,`${o.status==="open"?`<button class="g" data-a="packed" data-id="${o.id}">Mark as packed</button>`:""}<button data-a="done" data-id="${o.id}">Order complete</button>`)).join(""):`<p>No open orders.</p>`;
const binV=()=>`<p class="mut">Completed orders are deleted permanently after 15 days.</p>`+(done_().length?done_().map(o=>
  orderCard(o,`<span class="mut">Deleted in ${Math.max(0,Math.ceil(15-(Date.now()-o.doneAt)/DAY))} day(s)</span>`)).join(""):`<p>The bin is empty.</p>`);
const custV=()=>`<div class="card" style="margin-bottom:12px"><div class="price">${customers.length}</div><div class="mut">registered customers (only the owner and admins can see this page)</div></div>`+
  (customers.map(c=>`<div class="card" style="margin-bottom:12px"><div class="row"><b>${esc(c.nickname)}</b><span>📞 ${esc(c.phone)}</span><span class="mut">${esc(c.email||"")}</span><button class="g" data-a="prices" data-id="${c.uid}">💰 ${pricings[c.uid]?"Edit":"Set"} prices</button> <a class="wa" href="${wa(c.phone,`Hello ${c.nickname}, this is Peacock Order.`)}" target="_blank" rel="noopener">💬 WhatsApp</a>${c.joinedAt?`<span class="mut" style="margin-left:auto">Joined ${new Date(c.joinedAt).toLocaleDateString()}</span>`:""}</div>
  ${c.shopName?`<div>🏪 <b>${esc(c.shopName)}</b></div>`:""}${c.address?`<div>📍 ${esc(c.address)}</div>`:""}${c.other?`<div class="mut">📝 ${esc(c.other)}</div>`:""}</div>`).join("")||"<p>No customers yet.</p>");
const teamV=()=>`<div class="card"><h3 style="margin-top:0">Add a team member</h3>
  <form id="roleForm"><input name="email" type="email" required placeholder="their Google email">
  <select name="role"><option value="admin">Admin (list toys, prices, pictures, view orders)</option>${role==="owner"?'<option value="coOwner">Co-owner (can also manage admins)</option>':""}</select><button>Add</button></form></div>
  <div class="card" style="margin-top:12px"><div class="line"><b>${esc(OWNER)}</b><span class="pill">Owner</span></div>
  ${team.map(m=>`<div class="line"><span style="flex:1">${esc(m.email)}</span><span class="pill">${m.role==="coOwner"?"Co-owner":"Admin"}</span>
  ${role==="owner"||m.role==="admin"?`<button class="r" data-a="rmrole" data-id="${esc(m.email)}">Remove</button>`:""}</div>`).join("")}</div>`;

/* ---------- Dialogs ---------- */
const dlg=$("#dlg"),show=h=>{dlg.innerHTML=h;if(!dlg.open)dlg.showModal()};
function profileDlg(){show(`<h3 style="margin-top:0">Your details</h3><p class="mut">Your nickname is shown instead of your email. Your phone number is visible only to the shop owner and admins.</p>
 <form id="profForm"><label>Nickname (max 100 characters)<input name="nick" maxlength="100" required value="${esc(profile?.nickname)}"></label>
 <label>Contact number<input name="phone" type="tel" maxlength="30" required value="${esc(profile?.phone)}"></label>
 <p class="mut" style="margin:0 0 6px">Optional — only the shop owner and admins can see these:</p>
 <label>Shop name<input name="shopName" maxlength="100" value="${esc(profile?.shopName)}"></label>
 <label>Shop address<textarea name="address" maxlength="300" rows="2" style="width:100%;margin:4px 0 10px">${esc(profile?.address)}</textarea></label>
 <label>Other details (GST no., city, notes…)<input name="other" maxlength="300" value="${esc(profile?.other)}"></label><button>Save</button></form>`)}
function itemDlg(id){const i=items.find(x=>x.id===id)||{};
 show(`<h3 style="margin-top:0">${id?"Edit toy":"List a new toy"}</h3><form id="itemForm" data-id="${id||""}">
 <label>Name<input name="name" maxlength="80" required value="${esc(i.name)}"></label>
 <label>Price<input name="price" type="number" min="0" step="0.01" required value="${i.price??""}"></label>
 <label>Tag<select name="tag">${["","New","Sale","Best seller"].map(t=>`<option value="${t}" ${i.tag===t?"selected":""}>${t||"None"}</option>`).join("")}</select></label>
 <label>Old price (optional — shows a discount)<input name="oldPrice" type="number" min="0" step="0.01" value="${i.oldPrice||""}"></label>
 <label>Pictures (up to 3)${id?" — leave empty to keep current ones":""}<input name="files" type="file" accept="image/*" multiple></label><button>Save toy</button></form>`)}
const shrink=(src,max,q)=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");
  c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q))};i.onerror=rej;i.src=src});

dlg.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target,d=new FormData(f);
  try{
  if(f.id==="profForm"){profile={nickname:d.get("nick").trim().slice(0,100),phone:d.get("phone").trim(),shopName:d.get("shopName").trim(),address:d.get("address").trim(),other:d.get("other").trim(),email:user.email,joinedAt:profile?.joinedAt||Date.now()};await setDoc(doc(db,"users",user.uid),profile)}
  if(f.id==="itemForm"){
    const id=f.dataset.id,old=items.find(x=>x.id===id)||{},files=[...f.files.files].slice(0,3);
    let imgs=old.imgs||[],thumb=old.thumb||"";
    if(files.length){imgs=[];for(const fl of files)imgs.push(await shrink(URL.createObjectURL(fl),600,.7));thumb=await shrink(imgs[0],120,.6)}
    const data={name:d.get("name").trim(),price:Number(d.get("price")),tag:d.get("tag"),oldPrice:Number(d.get("oldPrice")||0),imgs,thumb};
    id?await updateDoc(doc(db,"items",id),data):await addDoc(collection(db,"items"),data);
  }
  if(f.id==="priceForm"){const prices={};items.forEach(i=>{const v=d.get("p_"+i.id);if(v!==""&&v!==null)prices[i.id]=Number(v)});
    await setDoc(doc(db,"pricing",f.dataset.uid),{discount:Number(d.get("discount")||0),prices})}
  dlg.close();draw();
  }catch(err){alert("Could not save: "+err.message)}
});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="roleForm")return;e.preventDefault();const d=new FormData(e.target),em=d.get("email").trim().toLowerCase();
  try{await setDoc(doc(db,"roles",em),{role:d.get("role")});e.target.reset()}catch(err){alert("Not allowed: "+err.message)}
});

/* ---------- Clicks ---------- */
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  try{
  if(a==="in")await signInWithPopup(auth,new GoogleAuthProvider());
  else if(a==="out")await signOut(auth);
  else if(a==="profile")profileDlg();
  else if(a==="add"){cart[id]=(cart[id]||0)+1;saveCart();draw()}
  else if(a==="dec"){cart[id]=(cart[id]||1)-1;if(cart[id]<=0)delete cart[id];saveCart();draw()}
  else if(a==="new")itemDlg();
  else if(a==="edit")itemDlg(id);
  else if(a==="del"){if(confirm("Remove this toy from the shop?"))await deleteDoc(doc(db,"items",id))}
  else if(a==="packed")await updateDoc(doc(db,"orders",id),{status:"packed",packedAt:Date.now()});
  else if(a==="install"){if(installEv){installEv.prompt();installEv=null;draw()}else show('<h3 style="margin-top:0">Install on iPhone / iPad</h3><p>Tap the <b>Share</b> button in Safari, then <b>Add to Home Screen</b>.</p><button data-a="close">Got it</button>')}
  else if(a==="close")dlg.close();
  else if(a==="prices"){const c=customers.find(x=>x.uid===id),p=pricings[id]||{};
    show(`<h3 style="margin-top:0">Prices for ${esc(c?.nickname)}</h3><p class="mut">Leave a toy blank to use the discount or the standard price.</p>
    <form id="priceForm" data-uid="${esc(id)}"><label>Discount on everything (%)<input name="discount" type="number" min="0" max="100" step="0.1" value="${p.discount||""}"></label>
    ${items.map(i=>`<label>${esc(i.name)} <span class="mut">(standard ${money(i.price)})</span><input name="p_${i.id}" type="number" min="0" step="0.01" value="${p.prices?.[i.id]??""}"></label>`).join("")}
    <button>Save prices</button> <button type="button" class="g" data-a="close">Cancel</button></form>`)}
  else if(a==="done")await updateDoc(doc(db,"orders",id),{status:"done",doneAt:Date.now(),expireAt:Timestamp.fromMillis(Date.now()+15*DAY)});
  else if(a==="rmrole"){if(confirm("Remove "+id+"?"))await deleteDoc(doc(db,"roles",id))}
  else if(a==="place"){
    if(!profile)return profileDlg();
    const lines=Object.entries(cart).map(([i,q])=>{const it=items.find(x=>x.id===i);return it&&{id:i,name:it.name,price:priceFor(it),qty:q,img:it.thumb||""}}).filter(Boolean);
    if(!lines.length)return;
    await addDoc(collection(db,"orders"),{uid:user.uid,nickname:profile.nickname,phone:profile.phone,shopName:profile.shopName||"",address:profile.address||"",items:lines,
      total:lines.reduce((s,x)=>s+x.price*x.qty,0),status:"open",createdAt:Date.now()});
    cart={};saveCart();location.hash="#mine";alert("Order placed! The shop will contact you.");
  }
  }catch(err){if(err.code!=="auth/popup-closed-by-user")alert("Something went wrong: "+err.message)}
});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
draw();
</script></body></html>
